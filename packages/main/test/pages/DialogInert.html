<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>Dialog</title>

	<script data-ui5-config type="application/json">
		{
			"language": "EN"
		}
	</script>

	<script>
		// delete Document.prototype.adoptedStyleSheets
	</script>
	<script src="%VITE_BUNDLE_PATH%" type="module"></script>
<link rel="stylesheet" type="text/css" href="./styles/Dialog.css">
</head>

<body>
	<div class="wrapper">
		<ui5-button id="btn1">Open Dialog</ui5-button>
		<ui5-dialog id="dialog1" header-text="Dialog Header" draggable resizable>
			<ui5-label>Dialog Content</ui5-label>
			<ui5-button id="btn2">Open Nested Dialog 2</ui5-button>
			<ui5-button id="btnOutsideDlg3">Open Outside Dialog 3</ui5-button>
			<ui5-button id="btnDlg1Close">Close</ui5-button>
			<ui5-button id="btnOpenOutsidePopover">Open Outside Popover</ui5-button>
			<ui5-dialog id="dialog2" header-text="Nested Dialog" draggable resizable>
				<ui5-label>Nested Dialog Content</ui5-label>
				<ui5-button>Close</ui5-button>
			</ui5-dialog>
			<ui5-popover id="popover1" header-text="Nested Popover">
				<ui5-label>Popover Content</ui5-label>
				<ui5-button>Close</ui5-button>
			</ui5-popover>
		</ui5-dialog>
	</div>
	<div class="wrapper">
		<ui5-button id="btn3">Open Dialog 3</ui5-button>
		<ui5-dialog id="dialog3" header-text="Outside Dialog" draggable resizable>
			<ui5-label>Dialog Content</ui5-label>
			<ui5-button>Close</ui5-button>
		</ui5-dialog>
		<ui5-popover id="popover2" opener="btnOpenOutsidePopover" header-text="Outside Popover">
			<ui5-label>Popover Content</ui5-label>
			<ui5-button id="btn4">Close</ui5-button>
		</ui5-popover>
	</div>
	<script>
		document.getElementById("btn1").addEventListener("click", function () {
			document.getElementById("dialog1").open = true;
		});
		document.getElementById("btn2").addEventListener("click", function () {
			document.getElementById("dialog2").open = true;
		});
		document.getElementById("btn3").addEventListener("click", function () {
			document.getElementById("dialog3").open = true;
		});
		document.getElementById("btnOutsideDlg3").addEventListener("click", function () {
			document.getElementById("dialog3").open = true;
		});
		document.getElementById("btnDlg1Close").addEventListener("click", function () {
			document.getElementById("dialog1").open = false;
		});
		document.getElementById("btn4").addEventListener("click", function () {
			document.getElementById("popover2").open = false;
		});

		document.getElementById("btnOpenOutsidePopover").addEventListener("click", function () {
			document.getElementById("popover2").open = true;
		});
	</script>
</body>
</html>
