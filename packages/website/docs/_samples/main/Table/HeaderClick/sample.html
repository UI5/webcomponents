<!-- playground-fold -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample</title>
</head>

<body style="background-color: var(--sapBackgroundColor)">
<!-- playground-fold-end -->
	<ui5-toast id="message"></ui5-toast>
	<ui5-table id="table">
		<ui5-table-header-row slot="headerRow">
			<ui5-table-header-cell id="productCol" interactive aria-haspopup="menu">
				<span>Product</span>
			</ui5-table-header-cell>
			<ui5-table-header-cell id="supplierCol" interactive aria-haspopup="menu">
				<span>Supplier</span>
				<ui5-table-header-cell-action-ai id="supplierAI" slot="action"></ui5-table-header-cell-action-ai>
			</ui5-table-header-cell>
<!-- playground-fold -->
			<ui5-table-header-cell id="dimensionsCol">Dimensions</ui5-table-header-cell>
			<ui5-table-header-cell id="priceCol"><span>Price</span></ui5-table-header-cell>
		</ui5-table-header-row>
		<ui5-table-row row-key="a" data-product="Notebook Basic 15" data-supplier="Very Best Screens">
			<ui5-table-cell><ui5-text><b>Notebook Basic 15</b><br>HT-1000</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text>Very Best Screens</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text>30 x 18 x 3 cm</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text><b>956</b> EUR</ui5-text></ui5-table-cell>
		</ui5-table-row>
		<ui5-table-row row-key="b" data-product="Notebook Basic 17" data-supplier="Smartcards">
			<ui5-table-cell><ui5-text><b>Notebook Basic 17</b><br>HT-1001</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text>Smartcards</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text>29 x 17 x 3.1 cm</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text><b>1249</b> EUR</ui5-text></ui5-table-cell>
		</ui5-table-row>
		<ui5-table-row row-key="c" data-product="Notebook Basic 18" data-supplier="Technocom">
			<ui5-table-cell><ui5-text><b>Notebook Basic 18</b><br>HT-1002</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text>Technocom</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text>32 x 21 x 4 cm</ui5-text></ui5-table-cell>
			<ui5-table-cell><ui5-text><b>29</b> EUR</ui5-text></ui5-table-cell>
		</ui5-table-row>
<!-- playground-fold-end -->
	</ui5-table>

	<ui5-menu id="sortMenu">
		<ui5-menu-item id="sortAscending" icon="sort-ascending" text="Sort Ascending"></ui5-menu-item>
		<ui5-menu-item id="sortDescending" icon="sort-descending" text="Sort Descending"></ui5-menu-item>
	</ui5-menu>

<!-- playground-fold -->
    <script type="module" src="main.js"></script>
</body>

</html>
<!-- playground-fold-end -->
