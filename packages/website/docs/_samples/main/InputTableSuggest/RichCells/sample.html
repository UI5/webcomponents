<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample</title>
</head>

<body style="background-color: var(--sapBackgroundColor); height: 380px;">
<!-- playground-fold-end -->

    <ui5-input-table-suggest id="team-input" placeholder="Search team members by name..." show-suggestions style="width: 520px;">
        <ui5-table-header-row slot="suggestionColumns">
            <ui5-table-header-cell width="150px">Name</ui5-table-header-cell>
            <ui5-table-header-cell width="80px">Avatar</ui5-table-header-cell>
            <ui5-table-header-cell min-width="160px">Role</ui5-table-header-cell>
            <ui5-table-header-cell width="120px">Location</ui5-table-header-cell>
            <ui5-table-header-cell width="100px">Status</ui5-table-header-cell>
        </ui5-table-header-row>

        <ui5-table-row slot="suggestionRows">
            <ui5-table-cell>Alice Brown</ui5-table-cell>
            <ui5-table-cell><ui5-avatar size="XS" initials="AB" color-scheme="Accent1"></ui5-avatar></ui5-table-cell>
            <ui5-table-cell>
                <div style="display: flex; flex-direction: column;">
                    <ui5-title level="H6" size="H6">Senior Developer</ui5-title>
                    <ui5-text>Engineering</ui5-text>
                </div>
            </ui5-table-cell>
            <ui5-table-cell><ui5-label>Building A</ui5-label></ui5-table-cell>
            <ui5-table-cell><ui5-tag color-scheme="8" design="Positive">Active</ui5-tag></ui5-table-cell>
        </ui5-table-row>
        <ui5-table-row slot="suggestionRows">
            <ui5-table-cell>Anna Clark</ui5-table-cell>
            <ui5-table-cell><ui5-avatar size="XS" initials="AC" color-scheme="Accent6"></ui5-avatar></ui5-table-cell>
            <ui5-table-cell>
                <div style="display: flex; flex-direction: column;">
                    <ui5-title level="H6" size="H6">UX Lead</ui5-title>
                    <ui5-text>Design</ui5-text>
                </div>
            </ui5-table-cell>
            <ui5-table-cell><ui5-label>Building B</ui5-label></ui5-table-cell>
            <ui5-table-cell><ui5-tag color-scheme="8" design="Positive">Active</ui5-tag></ui5-table-cell>
        </ui5-table-row>
        <ui5-table-row slot="suggestionRows">
            <ui5-table-cell>Adam Davis</ui5-table-cell>
            <ui5-table-cell><ui5-avatar size="XS" initials="AD" color-scheme="Accent8"></ui5-avatar></ui5-table-cell>
            <ui5-table-cell>
                <div style="display: flex; flex-direction: column;">
                    <ui5-title level="H6" size="H6">Account Manager</ui5-title>
                    <ui5-text>Sales</ui5-text>
                </div>
            </ui5-table-cell>
            <ui5-table-cell><ui5-label>Building C</ui5-label></ui5-table-cell>
            <ui5-table-cell><ui5-tag color-scheme="2" design="Critical">Away</ui5-tag></ui5-table-cell>
        </ui5-table-row>
        <ui5-table-row slot="suggestionRows">
            <ui5-table-cell>Brian Evans</ui5-table-cell>
            <ui5-table-cell><ui5-avatar size="XS" initials="BE" color-scheme="Accent3"></ui5-avatar></ui5-table-cell>
            <ui5-table-cell>
                <div style="display: flex; flex-direction: column;">
                    <ui5-title level="H6" size="H6">QA Engineer</ui5-title>
                    <ui5-text>Engineering</ui5-text>
                </div>
            </ui5-table-cell>
            <ui5-table-cell><ui5-label>Building A</ui5-label></ui5-table-cell>
            <ui5-table-cell><ui5-tag color-scheme="8" design="Positive">Active</ui5-tag></ui5-table-cell>
        </ui5-table-row>
        <ui5-table-row slot="suggestionRows">
            <ui5-table-cell>Bella Fox</ui5-table-cell>
            <ui5-table-cell><ui5-avatar size="XS" initials="BF" color-scheme="Accent4"></ui5-avatar></ui5-table-cell>
            <ui5-table-cell>
                <div style="display: flex; flex-direction: column;">
                    <ui5-title level="H6" size="H6">Recruiter</ui5-title>
                    <ui5-text>HR</ui5-text>
                </div>
            </ui5-table-cell>
            <ui5-table-cell><ui5-label>Building B</ui5-label></ui5-table-cell>
            <ui5-table-cell><ui5-tag color-scheme="2" design="Critical">Away</ui5-tag></ui5-table-cell>
        </ui5-table-row>
    </ui5-input-table-suggest>

<!-- playground-fold -->
    <script type="module" src="main.js"></script>
</body>

</html>
<!-- playground-fold-end -->
