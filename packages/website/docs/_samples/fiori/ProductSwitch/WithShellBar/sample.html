<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample</title>
</head>

<body style="background-color: var(--sapBackgroundColor); height: 400px;">
    <!-- playground-fold-end -->

    <ui5-shellbar id="shellbar" secondary-title="home" show-product-switch>
        <ui5-shellbar-branding slot="branding">
            Corporate Portal
            <img src="../assets/images/sap-logo-svg.svg" alt="SAP Logo" slot="logo" />
        </ui5-shellbar-branding>
		<ui5-toggle-button icon="sap-icon://da" design="Transparent" slot="assistant"></ui5-toggle-button>
    </ui5-shellbar>
    <ui5-popover id="productswitch-popover" placement="Bottom">
        <ui5-product-switch>
            <ui5-product-switch-item title-text="Home" subtitle-text="Central Home"
                icon="home" target-src="https://example.com/home" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Analytics Cloud" subtitle-text="Analytics Cloud"
                icon="business-objects-experience" target-src="https://example.com/analytics" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Catalog" subtitle-text="Ariba"
                icon="contacts" target-src="https://example.com/catalog" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Guided Buying" icon="credit-card" target-src="https://example.com/buying" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Strategic Procurement" icon="cart-3" target-src="https://example.com/procurement" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Travel &amp; Expense" subtitle-text="Concur"
                icon="flight" target-src="https://example.com/travel" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Vendor Management" subtitle-text="Fieldglass"
                icon="shipping-status" target-src="https://example.com/vendors" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Human Capital Management" icon="customer" target-src="https://example.com/hcm" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Sales Cloud" subtitle-text="Sales Cloud"
                icon="sales-notification" target-src="https://example.com/sales" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Commerce Cloud" subtitle-text="Commerce Cloud"
                icon="retail-store" target-src="https://example.com/commerce" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Marketing Cloud" subtitle-text="Marketing Cloud"
                icon="marketing-campaign" target-src="https://example.com/marketing" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Service Cloud" icon="family-care" target-src="https://example.com/service" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="Customer Data Cloud"
                icon="customer-briefing" target-src="https://example.com/customer-data" target="_blank"></ui5-product-switch-item>
            <ui5-product-switch-item title-text="S/4HANA" icon="batch-payments" target-src="https://example.com/s4hana" target="_blank"></ui5-product-switch-item>
        </ui5-product-switch>

    </ui5-popover>
    <!-- playground-fold -->
    <script type="module" src="main.js"></script>
</body>

</html>
<!-- playground-fold-end -->
