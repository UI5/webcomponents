<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>FilterBar</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<script data-ui5-config type="application/json">
		{
			"rtl": false
		}
	</script>

	<script src="%VITE_BUNDLE_PATH%" type="module"></script>

	<style>
		
	</style>
</head>

<body>
	<div class="section">
		<h3>FilterBar with all buttons visible (default)</h3>
		<ui5-filterbar id="filterbar1" show-basic-search>
			<ui5-filterbar-item>
				<ui5-label slot="label" for="product">Product</ui5-label>
				<ui5-input placeholder="Enter product name" id="product"></ui5-input>
			</ui5-filterbar-item>
			<ui5-filterbar-item>
				<ui5-label slot="label" for="status">Status</ui5-label>
				<ui5-select id="status">
					<ui5-option>Active</ui5-option>
					<ui5-option>Inactive</ui5-option>
					<ui5-option>Pending</ui5-option>
				</ui5-select>
			</ui5-filterbar-item>
			<ui5-filterbar-item>
				<ui5-label slot="label" for="dateRange">Date Range</ui5-label>
				<ui5-date-picker placeholder="Select date" id="dateRange"></ui5-date-picker>
			</ui5-filterbar-item>
		</ui5-filterbar>
	</div>

	<div class="section">
		<h3>Event Log:</h3>
		<div id="eventLog" style="border: 1px solid #ccc; padding: 10px; min-height: 100px; font-family: monospace;"></div>
	</div>

	<script>
		const filterbar1 = document.getElementById("filterbar1");
		const filterbar2 = document.getElementById("filterbar2");
		const filterbar3 = document.getElementById("filterbar3");
		const eventLog = document.getElementById("eventLog");

		function logEvent(filterbarId, eventName) {
			const timestamp = new Date().toLocaleTimeString();
			const message = `[${timestamp}] ${filterbarId}: ${eventName} event fired\n`;
			eventLog.textContent += message;
			console.log(message);
		}

		// Add event listeners for filterbar1
		filterbar1.addEventListener("go", () => logEvent("filterbar1", "go"));
		filterbar1.addEventListener("filters-press", () => logEvent("filterbar1", "filters-press"));
		filterbar1.addEventListener("restore", () => logEvent("filterbar1", "restore"));
		filterbar1.addEventListener("clear", () => logEvent("filterbar1", "clear"));

		// // Add event listeners for filterbar2

	</script>
