<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>FilterBar</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<script data-ui5-config type="application/json">
		{
			"rtl": false
		}
	</script>

	<script src="%VITE_BUNDLE_PATH%" type="module"></script>
	<script src="../../../main/src/bundle.esm.ts" type="module"></script>
	<script type="module">
		import "../../../main/src/ComboBox.ts";
		import "../../../main/src/MultiComboBox.ts";
		import "../../../main/src/ComboBoxItem.ts";
		import "../../../main/src/MultiComboBoxItem.ts";
		import "../../../main/src/StepInput.ts";
		import "../../../main/src/RatingIndicator.ts";
		import "../../../main/src/Switch.ts";
		import "../../../main/src/MultiInput.ts";
		import "../../../main/src/Token.ts";
		import "../../../main/src/DateRangePicker.ts";
	</script>

	<style>
		body {
			padding: 2rem;
			font-family: "72", Arial, Helvetica, sans-serif;
			background: var(--sapBackgroundColor);
		}
	</style>
</head>

<body>
	<ui5-filterbar id="filterbar1" show-basic-search show-restore-on-f-b show-reset-button>
		<ui5-filterbar-item filter-key="stepInput" label="StepInput" required>
			<ui5-step-input id="stepInput" value="0"></ui5-step-input>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="ratingIndicator" label="RatingIndicator">
			<ui5-rating-indicator id="ratingIndicator"></ui5-rating-indicator>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="multiInput" label="MultiInput">
			<ui5-multi-input id="multiInput">
				<ui5-token slot="tokens" text="Argentina"></ui5-token>
				<ui5-token slot="tokens" text="Bulgaria"></ui5-token>
				<ui5-token slot="tokens" text="England"></ui5-token>
				<ui5-token slot="tokens" text="Finland"></ui5-token>
			</ui5-multi-input>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="input" label="Input">
			<ui5-input id="input" placeholder="Placeholder"></ui5-input>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="switch" label="Switch">
			<ui5-switch id="switch"></ui5-switch>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="select" label="SELECT w/o initial selected">
			<ui5-select id="select">
				<ui5-option></ui5-option>
				<ui5-option additional-text="AT">Test 1</ui5-option>
				<ui5-option additional-text="BE">Test 2</ui5-option>
				<ui5-option additional-text="DE">Test 3</ui5-option>
			</ui5-select>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="multiComboBox" label="MultiBox w/ initial selected">
			<ui5-multi-combobox id="multiComboBox">
				<ui5-mcb-item text="Item 1" selected></ui5-mcb-item>
				<ui5-mcb-item text="Item 2" selected></ui5-mcb-item>
				<ui5-mcb-item text="Item 3"></ui5-mcb-item>
			</ui5-multi-combobox>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="comboBox" label="ComboBox w/o initial selected">
			<ui5-combobox id="comboBox">
				<ui5-cb-item text="Item 1"></ui5-cb-item>
				<ui5-cb-item text="Item 2"></ui5-cb-item>
				<ui5-cb-item text="Item 3"></ui5-cb-item>
			</ui5-combobox>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="datePicker" label="Date Picker">
			<ui5-daterange-picker id="datePicker" placeholder="e.g. Dec 24, 2026 - Dec 30, 2026"></ui5-daterange-picker>
		</ui5-filterbar-item>
	</ui5-filterbar>

	<ui5-adapt-filters-dialog id="adptfilters" filter-bar="filterbar1">
		<ui5-filterbar-item filter-key="stepInput" label="StepInput" group-name="Basic" group-order="0" required>
			<ui5-step-input value="0"></ui5-step-input>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="ratingIndicator" label="RatingIndicator" group-name="Basic" group-order="0">
			<ui5-rating-indicator></ui5-rating-indicator>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="multiInput" label="MultiInput" group-name="Basic" group-order="0">
			<ui5-multi-input>
				<ui5-token slot="tokens" text="Argentina"></ui5-token>
				<ui5-token slot="tokens" text="Bulgaria"></ui5-token>
				<ui5-token slot="tokens" text="England"></ui5-token>
				<ui5-token slot="tokens" text="Finland"></ui5-token>
			</ui5-multi-input>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="input" label="Input" group-name="Basic" group-order="0">
			<ui5-input placeholder="Placeholder"></ui5-input>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="switch" label="Switch" group-name="Advanced" group-order="1">
			<ui5-switch></ui5-switch>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="select" label="SELECT w/o initial selected" group-name="Advanced" group-order="1">
			<ui5-select>
				<ui5-option></ui5-option>
				<ui5-option additional-text="AT">Test 1</ui5-option>
				<ui5-option additional-text="BE">Test 2</ui5-option>
				<ui5-option additional-text="DE">Test 3</ui5-option>
			</ui5-select>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="multiComboBox" label="MultiBox w/ initial selected" group-name="Advanced" group-order="1">
			<ui5-multi-combobox>
				<ui5-mcb-item text="Item 1" selected></ui5-mcb-item>
				<ui5-mcb-item text="Item 2" selected></ui5-mcb-item>
				<ui5-mcb-item text="Item 3"></ui5-mcb-item>
			</ui5-multi-combobox>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="comboBox" label="ComboBox w/o initial selected" group-name="Date Filters" group-order="2">
			<ui5-combobox>
				<ui5-cb-item text="Item 1"></ui5-cb-item>
				<ui5-cb-item text="Item 2"></ui5-cb-item>
				<ui5-cb-item text="Item 3"></ui5-cb-item>
			</ui5-combobox>
		</ui5-filterbar-item>
		<ui5-filterbar-item filter-key="datePicker" label="Date Picker" group-name="Date Filters" group-order="2">
			<ui5-daterange-picker placeholder="e.g. Dec 24, 2026 - Dec 30, 2026"></ui5-daterange-picker>
		</ui5-filterbar-item>
	</ui5-adapt-filters-dialog>

	<div style="padding: 1rem">
		<h3>Event Log:</h3>
		<div id="eventLog" style="border: 1px solid #ccc; padding: 10px; min-height: 60px; font-family: monospace; font-size: 0.8rem; white-space: pre;"></div>
	</div>

	<script>
		const filterbar = document.getElementById("filterbar1");
		const dialog = document.getElementById("adptfilters");
		const eventLog = document.getElementById("eventLog");

		// Pending reorder from dialog — only applied on confirm/filter, discarded on cancel
		let pendingKeyOrder = null;

		function log(msg) {
			const ts = new Date().toLocaleTimeString();
			eventLog.textContent += `[${ts}] ${msg}\n`;
		}

		function applyKeyOrderToFilterbar(keys) {
			keys.forEach(key => {
				const fbItem = filterbar.querySelector(`ui5-filterbar-item[filter-key="${key}"]`);
				if (fbItem) filterbar.appendChild(fbItem);
				const dlgItem = dialog.querySelector(`ui5-filterbar-item[filter-key="${key}"]`);
				if (dlgItem) dialog.appendChild(dlgItem);
			});
		}

		function applyVisibilityAndSync(visibilityMap) {
			filterbar.querySelectorAll("ui5-filterbar-item").forEach(fbItem => {
				const key = fbItem.getAttribute("filter-key");
				if (!key) return;
				if (key in visibilityMap) fbItem.hidden = !visibilityMap[key];
			});
		}

		filterbar.addEventListener("toggle-filters", () => {
			pendingKeyOrder = null;
			const keyOrder = [...filterbar.querySelectorAll("ui5-filterbar-item")]
				.map(item => item.getAttribute("filter-key")).filter(Boolean);
			dialog.show(keyOrder);
			log("toggle-filters → dialog opened");
		});

		filterbar.addEventListener("go", () => log("go fired"));
		filterbar.addEventListener("restore", () => log("restore fired"));
		filterbar.addEventListener("reset", () => log("reset fired (filterbar)"));

		dialog.addEventListener("filters-dialog-save", (e) => {
			const { visibilityMap } = e.detail;
			if (pendingKeyOrder) {
				applyKeyOrderToFilterbar(pendingKeyOrder);
				pendingKeyOrder = null;
			}
			applyVisibilityAndSync(visibilityMap);
			const visible = Object.entries(visibilityMap).filter(([, v]) => v).map(([k]) => k).join(", ");
			log(`filters-dialog-save → visible: ${visible}`);
		});

		dialog.addEventListener("filters-dialog-cancel", (e) => {
			pendingKeyOrder = null;
			log(`dialog cancelled (escPressed: ${e.detail.escPressed})`);
		});

		dialog.addEventListener("filters-dialog-open", () => log("filters-dialog-open"));
		dialog.addEventListener("after-filters-dialog-open", () => log("after-filters-dialog-open"));
		dialog.addEventListener("filters-dialog-close", (e) => log(`filters-dialog-close → ${e.detail.closeTrigger}`));
		dialog.addEventListener("filters-dialog-search", (e) => log(`filters-dialog-search → ${e.detail.value}`));

		dialog.addEventListener("filters-dialog-selection-change", (e) => {
			log(`selection-change → ${e.detail.filter.getAttribute("filter-key")}: ${e.detail.visible}`);
		});

		dialog.addEventListener("filter-remove", (e) => {
			const key = e.detail.filter.getAttribute("filter-key");
			// The dialog moves the removed item into its availableFilters pool itself.
			// The app only needs to hide the matching filterbar item.
			const fbItem = filterbar.querySelector(`ui5-filterbar-item[filter-key="${key}"]`);
			if (fbItem) fbItem.hidden = true;
			log(`filter-remove → ${key}`);
		});

		dialog.addEventListener("filter", (e) => {
			const { visibilityMap } = e.detail;
			if (pendingKeyOrder) {
				applyKeyOrderToFilterbar(pendingKeyOrder);
				pendingKeyOrder = null;
			}
			applyVisibilityAndSync(visibilityMap);
			filterbar.go();
			log(`filter → applied and go triggered`);
		});

		dialog.addEventListener("reorder", (e) => {
			pendingKeyOrder = e.detail.keys;
			log(`reorder (pending) → ${e.detail.keys.join(", ")}`);
		});

		dialog.addEventListener("reset", () => {
			log("reset");
		});

		dialog.addEventListener("filter-add", (e) => {
			const key = e.detail.filterKey;
			// The dialog moves the item back into its active list itself.
			// The app only needs to un-hide the matching filterbar item.
			const fbItem = filterbar.querySelector(`ui5-filterbar-item[filter-key="${key}"]`);
			if (fbItem) fbItem.hidden = false;
			log(`filter-add → ${key}`);
		});
	</script>
</body>
</html>
