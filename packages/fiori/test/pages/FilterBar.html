<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>FilterBar</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<script data-ui5-config type="application/json">
		{
			"rtl": false
		}
	</script>

	<script src="%VITE_BUNDLE_PATH%" type="module"></script>

	<style>
		
	</style>
</head>

<body>
	<div class="section">
		<ui5-filterbar id="filterbar1">
			<ui5-filterbar-item>
				<ui5-label slot="label" for="product">Product</ui5-label>
				<ui5-input placeholder="Enter product name" id="product"></ui5-input>
			</ui5-filterbar-item>
			<ui5-filterbar-item>
				<ui5-label slot="label" for="status">Status</ui5-label>
				<ui5-select id="status">
					<ui5-option>Active</ui5-option>
					<ui5-option>Inactive</ui5-option>
					<ui5-option>Pending</ui5-option>
				</ui5-select>
			</ui5-filterbar-item>
			<ui5-filterbar-item>
				<ui5-label slot="label" for="dateRange">Date Range</ui5-label>
				<ui5-date-picker placeholder="Select date" id="dateRange"></ui5-date-picker>
			</ui5-filterbar-item>
		</ui5-filterbar>
	</div>

	<script>
		const filterbar1 = document.getElementById("filterbar1");
		
		filterbar1.addEventListener("click", function(e) {
			console.log("FilterBar clicked:", e.target);
		});
	</script>
</body>
</html>
