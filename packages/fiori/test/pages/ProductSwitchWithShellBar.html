<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>ui5-product-switch - ShellBar scenario</title>

	<script data-ui5-config type="application/json">
		{
			"rtl": false
		}
	</script>

	<script src="%VITE_BUNDLE_PATH%" type="module"></script>

	<style>
		body {
			background-color: var(--sapBackgroundColor);
		}
	</style>
</head>

<body>
	<ui5-shellbar id="shellbar" secondary-title="Home" show-product-switch>
		<ui5-shellbar-branding slot="branding">
			Corporate Portal
			<img src="https://upload.wikimedia.org/wikipedia/commons/5/59/SAP_2011_logo.svg" alt="SAP Logo" slot="logo" />
		</ui5-shellbar-branding>
		<ui5-toggle-button icon="sap-icon://da" design="Transparent" slot="assistant"></ui5-toggle-button>
	</ui5-shellbar>

	<ui5-popover id="productswitch-popover" placement="Bottom">
		<ui5-product-switch>
			<ui5-product-switch-item title-text="Home" subtitle-text="Central Home"
				icon="home" target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Analytics Cloud" subtitle-text="Analytics Cloud"
				icon="business-objects-experience" target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Catalog" subtitle-text="Ariba"
				icon="contacts" target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Guided Buying" icon="credit-card"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Strategic Procurement" icon="cart-3"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Travel &amp; Expense" subtitle-text="Concur"
				icon="flight" target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Vendor Management" subtitle-text="Fieldglass"
				icon="shipping-status" target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Human Capital Management" icon="customer"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Sales Cloud" subtitle-text="Sales Cloud"
				icon="sales-notification" target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Commerce Cloud" subtitle-text="Commerce Cloud"
				icon="retail-store" target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Marketing Cloud" subtitle-text="Marketing Cloud"
				icon="marketing-campaign" target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Service Cloud" icon="family-care"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Customer Data Cloud" icon="customer-briefing"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Customer Data Cloud" icon="customer-briefing"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Customer Data Cloud" icon="customer-briefing"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="Customer Data Cloud" icon="customer-briefing"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
			<ui5-product-switch-item title-text="S/4HANA" icon="batch-payments"
				target-src="about:blank" target="_blank"></ui5-product-switch-item>
		</ui5-product-switch>
	</ui5-popover>

	<script>
		var shellBar = document.getElementById("shellbar");
		var popover = document.getElementById("productswitch-popover");
		var productSwitch = popover.querySelector("ui5-product-switch");

		shellBar.addEventListener("product-switch-click", function(event) {
			if (popover.open) {
				popover.open = false;
			} else {
				event.preventDefault();
				popover.opener = event.detail.targetRef;
				popover.open = true;
			}
		});

		productSwitch.addEventListener("click", function() {
			popover.open = false;
		});

		[...document.querySelectorAll("ui5-toggle-button")].forEach(function(el) {
			el.addEventListener("click", function(event) {
				var toggleButton = event.target;
				toggleButton.icon = toggleButton.pressed ? "sap-icon://da-2" : "sap-icon://da";
			});
		});
	</script>
</body>

</html>
